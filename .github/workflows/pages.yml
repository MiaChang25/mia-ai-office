# 推上 main 就發布 GitHub Pages。
# enablement: true 會在網站還沒建立時嘗試開啟 Pages。
# 預設的 GITHUB_TOKEN 沒有儲存庫管理權限，通常無法代為建立。
# 若「Configure Pages」失敗，請到 Settings → Pages → Build and deployment
# → Source 選擇 GitHub Actions，然後重跑這個 workflow。
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html status.json _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
